<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Multiplayer Dungeon Game</title>
		<meta property="og:image" content="image/screen.jpg">
		<script src="sprite.json"></script>
		<link href="https://fonts.googleapis.com/css?family=VT323&display=swap" rel="stylesheet">
		<script
  src="https://code.jquery.com/jquery-3.4.1.slim.min.js"
  integrity="sha256-pasqAKBDmFT4eHoN2ndd6lN370kFiGUFyTiUHWhU7k8="
  crossorigin="anonymous"></script>
	</head>
	<link href="style.css" rel="stylesheet">
	<body>
		<canvas id="canvas"></canvas>
		<div id="signinBackground">
			<div id="signin">
				<b>Pick a Name</b>
				<input type="text" id="name"></input>
				<input type="button" value="Play" onclick="startGame()"/></input>
				<small>Controls: Arrow keys or WASD to move. Move mouse to control weapon. Click or spacebar to use special attack.</small>
			</div>
		</div>
		<menu>
		<div id="shop">
			<div class="shopChest"></div>
			<div class="shopText">SHOP</div>
		</div>
		<div id="popmenu">
			<div id="refreshShop" class="display">
				Your Gold <span id="gold">G</span>
				<div class="bbutton">1G Refresh Shop</div>
			</div>
			
			<div class="choices">
				<div id="section1" class="choice">
					<div class="wrapper">
						<img src="" width="50px" height="150px">
						<div class="detail"></div>
					</div>
					<div class="bbutton">Buy</div>
				</div>
				<div id="section2" class="choice">
					<div class="wrapper">
						<img src="" width="50px" height="150px">
						<div class="detail"></div>
					</div>
					<div class="bbutton">Buy</div>
				</div>
				<div id="section3" class="choice">
					<div class="wrapper">
						<img src="" width="50px" height="150px">
						<div class="detail"></div>
					</div>
					<div class="bbutton">Buy</div>
				</div>
				<div id="section4" class="choice">
					<div class="wrapper">
						<img src="" width="50px" height="150px">
						<div class="detail"></div>
					</div>
					<div class="bbutton">Buy</div>
				</div>
				<div id="section5" class="choice">
					<div class="wrapper">
						<img src="" width="50px" height="150px">
						<div class="detail"></div>
					</div>
					<div class="bbutton">Buy</div>
				</div>
				<div id="section6" class="choice">
					<div class="wrapper">
						<img src="" width="50px" height="150px">
						<div class="detail"></div>
					</div>
					<div class="bbutton">Buy</div>
				</div>
			</div>
		</div>
		</menu>
		<div id="xp">
			<div id="bar"></div>
		</div>
	</body>
	<script src="client_script.js"></script>
</html>
