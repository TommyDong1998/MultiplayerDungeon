<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Multiplayer Dungeon Game</title>
		<meta property="og:image" content="image/screen.jpg">
		<script src="sprite.json"></script>
		<link href="https://fonts.googleapis.com/css?family=VT323&display=swap" rel="stylesheet">
		<script
  src="https://code.jquery.com/jquery-3.4.1.slim.min.js"
  integrity="sha256-pasqAKBDmFT4eHoN2ndd6lN370kFiGUFyTiUHWhU7k8="
  crossorigin="anonymous"></script>
	</head>
	<style>
		body {
		    margin: 0;
		    font-family: sans-serif;
		    background: #6e6262;
		}
		canvas{
			display:block;
		}
		menu{
			position:fixed;
			top:0;
			width:100%;
		}
		menu #shop{
			image-rendering: pixelated;
			image-rendering: -moz-crisp-edges;
			image-rendering: crisp-edges;
			float:right;
			margin-top:15px;
			margin-right:10%;
			background-image:url(images/chest.png);
			width:100px;
			height:88px;
			background-size:contain;
		}
		menu #shop:hover{
			background-image:url(images/lightchest.png);
		}
		img{
			image-rendering: pixelated;
			image-rendering: -moz-crisp-edges;
			image-rendering: crisp-edges;
		}
		#popmenu{
			visibility:hidden;
			position:fixed;
			top:10%;
			left:15%;
			width:70%;
			height:70%;
			margin:auto;
			background:rgba(223, 223, 234, 0.95);
			padding:10px;
			box-sizing:border-box;
			color:grey;
			font-size:20px;
			display:flex;
		}
		#popmenu .choice,.display{
			background:#efefef;
			flex:1;
			margin:10px;
			position:relative;
			text-align:center;
		}
		#popmenu img{
			margin:25px;
		}
		#popmenu .bbutton{
			background: #539eff;
			width: 100%;
			box-sizing: border-box;
			text-align: center;
			color: white;
			padding: 15px;
			cursor:pointer;
		}
		#popmenu .bbutton:hover{
			color:grey;
		}
		#popmenu .wrapper{
			position:absolute;
			bottom:0;
			width:100%;
		}
		#popmenu .detail{
			padding:10px;
			color: white;
			background:black;
			padding: 15px;
		}
		#xp{
			position:fixed;
			bottom:30px;
			left:10%;
			width:80%;
			background:white;
			height:20px;
			visibility:hidden;
		}
		#xp #bar{
			width:80%;
			background:#ff0000b0;
			height:20px;
		}
		#signinBackground{
			width:100vw;
			height:100vh;
			background: url('/images/screen.jpg');
			background-size: cover;
			position:fixed;
			top:0;
		}
		#signin{
			background:#facb3e;
			width:500px;
			position: fixed;
			top: 50%; right: 50%;
			padding:20px;
			transform: translate(50%,-50%);
		}
		#signin input{
			display:block;
			padding: 10px;
			outline: 0;
			border: 0;
			margin:20px 0;
			width: 100%;
			box-sizing: border-box;
		}
	</style>
	<body>
		<canvas id="canvas"></canvas>
		<div id="signinBackground">
			<div id="signin">
				<b>Pick a Name</b>
				<input type="text" id="name"></input>
				<input type="button" value="Play" onclick="startGame()"/></input>
			</div>
		</div>
		<menu>
		<div id="shop"></div>
		<div id="popmenu">
			<div id="section1" class="choice">
			<img src="" width="100px">
			<div class="wrapper">
				<div class="detail"><br><small></small></div>
				<div class="bbutton"></div>
			</div>
			</div>
			<div id="refreshShop" class="display">
			<div class="detail">Your Gold<br><small id="gold">G</small></div>
			<div class="bbutton">1G Refresh Shop</div>
			</div>
			<div id="section2" class="choice">
				<img src="" width="100px">
				<div class="wrapper">
					<div class="detail"><br><small></small></div>
					<div class="bbutton"></div>
				</div>
			</div>
		</div>
		</menu>
		<div id="xp">
			<div id="bar"></div>
		</div>
	</body>
	<script>
	var itemsDef=[{name:"RustySword",description:"A little longer.Moderate chance of doing double damage!",cost:6},
	{name:"Dagger",description:"Very short. Little knockback. Increased gold chance!",cost:5},
	{name:"Warrior",description:"Extra health. Invincible charge special attack!",cost:15},
	{name:"Vampire",description:"Doing damage heals you!",cost:20},
	{name:"Human Leader",description:"Extra hp",cost:15},
	{name:"Potion Hoarder",description:"He hoards potions. Then he throw them at people.",cost:15},
	{name:"JimmysRustySword",description:"The Sword of the Superior Swordsman.",cost:8}
	];
	///////////////
	const canvas = document.getElementById('canvas');
	canvas.width=window.innerWidth;
	canvas.height=window.innerHeight;
	var ctx=canvas.getContext('2d');
	ctx.imageSmoothingEnabled =false;
	/////Shop
	document.querySelector("#shop").onclick=()=>{
		if(document.querySelector("#popmenu").style.visibility!="visible"){
			document.querySelector("#popmenu").style.visibility="visible";
		}else{
			document.querySelector("#popmenu").style.visibility="hidden";
		}
	};
	var currentShop=[];
	document.querySelector("#section1 .bbutton").onclick=()=>{
		buyShop(currentShop[0]);
		document.querySelector("#popmenu").style.visibility="hidden";
		createBlankItem(0);
	}
	document.querySelector("#section2 .bbutton").onclick=()=>{
		buyShop(currentShop[1]);
		document.querySelector("#popmenu").style.visibility="hidden";
		createBlankItem(1);
	}
	document.querySelector("#refreshShop .bbutton").onclick=()=>{
		socket.send(JSON.stringify([4]));
	}
	function setXp(amt){
		document.querySelector("#xp #bar").style.visibility="visible";
		document.querySelector("#xp #bar").style.width=amt+"%";
	}
	function createBlankItem(loc){
		var doc=document.querySelector("#section"+(loc+1));
		doc.querySelector("img").src="";
		doc.querySelector(".detail").innerHTML="Nothing for sale<br/><small>Nothing here</small>";
		currentShop[loc]=false;
	}
	function createItem(loc,item){
		var doc=document.querySelector("#section"+loc);
		doc.querySelector("img").src="images/"+itemsDef[item].name+".png";
		doc.querySelector(".detail").innerHTML=itemsDef[item].name+"<br/><small>"+itemsDef[item].description+"</small>";
		doc.querySelector(".bbutton").innerText=itemsDef[item].cost+"G Buy";
		currentShop[loc-1]=item;
	}
	function buyShop(item){
		socket.send(JSON.stringify([3,item]))
	}
	/////
	var setting={
		scale:window.innerWidth/512
	};
	ctx.scale(setting.scale ,setting.scale);
	var player;
	var gold;
	class item{
		constructor(item){
			this.id=item.id;
			this.zOrder=item.z||0;
			this.static=item.static;
			this.sprite={x:0,y:0,width:0,height:0,info:loadSprite(item.sprite)};
			this.particle=item.particle;
			this.update(item);
			updateIndex();
			if(item.player){
			player=this;
			console.log("new player")
			}
		}
		update(item){
			var sprite=this.sprite;
			if(item.sprite){
				sprite.info=loadSprite(item.sprite);
			}
			if(item.x!=undefined){
				var difference=item.x-sprite.x;
				sprite.x=item.x;
			}
			if(item.y!=undefined)
				sprite.y=item.y;
			if(item.w){
				sprite.width=item.w;
			}
			if(item.hp!=undefined){
				sprite.hp=item.hp;
			}
			if(item.maxHP!=undefined){
				sprite.maxHP=item.maxHP;
			}
			if(item.xp!=undefined){
				sprite.xp=item.xp;
			}
			if(item.playerName!=undefined){
				sprite.playerName=item.playerName;
			}
			if(item.h)
				sprite.height=item.h;
			if(item.origin){
				sprite.origin=item.origin;
			}
			if(item.rotate){
				sprite.rotate=item.rotate;
			}
			if(item.facing!=undefined){
				sprite.flip=item.facing!=1;
			}
			if(item.gold!=undefined){
				gold=item.gold;
				document.querySelector("#gold").innerText=gold+"G";
			}
			if(item.potion!=undefined){
				sprite.potion=item.potion;
			}
	}
	}
	class map{
		constructor(){
			this.map={};
			this.update= [];
		}
		addOrUpdate(obj){
			if(this.map[obj.id]){
				this.map[obj.id].update(obj);
			}
			else{
				this.map[obj.id]=new item(obj);
			}
			if (this.update.indexOf(this.map[obj.id])==-1){
				this.update.push(this.map[obj.id])
			}
			if(this.map[obj.id].visibility==false){
				this.map[obj.id].visibility=true;
			}
		}
		remove(entity){
			//Set to invisible instead of removing object since server only sends new info about an object
			if(this.map[entity])
				this.map[entity].visibility=false;
		}
	}

	//Holds all the items
	var gameMap= new map;
	//	Load tiles
	var tiles=new Image(512,512);
	tiles.src="images/map.png";

	//	Do this when the tiles are loaded
	tiles.onload=loaded;
	function loaded(){
		window.requestAnimationFrame(update);
	}

	//	Load information about the sprite
	function loadSprite(name){
		//If inside sprite sheet
		var info=spriteData[name];
		if(info){
			return info;
		}else if(typeof name =="number"){
			return {x:(name%32)*16,y:(Math.trunc(name/32))*16,width:16,height:16};
		}else if(name=="elf"){
			return [{x:16*8+1,y:16*3-3,width:15,height:19},
					{x:16*9+1,y:16*3-2,width:15,height:18},
					{x:16*10+1,y:16*3-1,width:15,height:17},
					{x:16*11+1,y:16*3-2,width:15,height:18}];
		}else if(name=="knight"){
			return [{x:16*8+1,y:108,width:15,height:20},
					{x:16*9+1,y:108,width:15,height:20},
					{x:16*10+1,y:108,width:15,height:20},
					{x:16*11+1,y:109,width:15,height:20}];
		}else if(name=="skeleton"){
			return [{x:371,y:82,width:10,height:14},
					{x:387,y:84,width:10,height:12},
					{x:403,y:85,width:10,height:11},
					
					{x: 418,y: 83,width:10,height:13}];
		}else if(name=="demon"){
			return [{x:21,y:370,width:23,height:30},
					{x:52,y:369,width:24,height:31},
					{x:85,y:369,width:22,height:32},
					{x: 115,y: 372,width:26,height:29}];
		}else if(name=="minion"){
			return [{x:371,y:334,width:11,height:18},
					{x:387,y:338,width:11,height:18},
					{x:403,y:337,width:11,height:18},
					{x: 419,y: 331,width:10,height:21}];
		}
		return {x:0,y:0,width:0,height:0};
	}

	var util={
		drawSprite:(info,sprite)=>{
			ctx.drawImage(tiles,info.x,info.y,info.width,info.height,
							sprite.x,sprite.y,sprite.width,sprite.height);
		},
		flip:(info,sprite,c)=>{
			ctx.save();
			ctx.scale(-1,1);
			c({x:(sprite.x+sprite.width)*-1,y:sprite.y,width:sprite.width,height:sprite.height});
			ctx.restore();
		},
		rotate:(info,sprite,c)=>{
			ctx.save();

			var origin={};
			if(sprite.origin)
				origin=sprite.origin;
			var x=origin.x
			var y=origin.y
			var rotate=sprite.rotate;

			ctx.translate(sprite.x+x,sprite.y+y);
			ctx.rotate(rotate);
			ctx.translate((sprite.x+x)*-1,(sprite.y+y)*-1);
			c({x:sprite.x,y:sprite.y,width:sprite.width,height:sprite.height});
			ctx.restore();
		}
	}
	function clamp(value, min, max){
		if(value < min) return min;
		else if(value > max) return max;
		return value;
	}
	//	Update the canvas once per frame
	function update(){
		ctx.clearRect(0, 0, window.innerHeight, window.innerWidth)

		//Camera
		ctx.save()
		if(player){
			ctx.translate(window.innerWidth/setting.scale/2-player.sprite.x-player.sprite.width/2,
							window.innerHeight/setting.scale/2-player.sprite.y-player.sprite.height/2);
		}

		//Draw all items
		for(var item of gameMap.update){
			if(item.visibility == false)
				continue;

			//Load sprite information
			var info=item.sprite.info;
			var sprite=item.sprite;
			if(info.length){
				sprite.frame=sprite.frame||0;
				info=info[Math.trunc(sprite.frame/5)%4];
				sprite.frame++;
			}
			var spriteInfo=Object.assign({},item.sprite);
			var origin={};

			if(item.particle){
				ctx.fillRect(info.x,info.y,10,10);
			}
			else if(sprite.rotate!=undefined){
				util.rotate(info,sprite,()=>{
					if(sprite.flip){
						util.flip(info,sprite,(sprite)=>{
							util.drawSprite(info,sprite);
						});
					}else{
						util.drawSprite(info,sprite);
					}
				});
			}else{
				if(sprite.flip){
						util.flip(info,sprite,(sprite)=>{
							util.drawSprite(info,sprite);
						});
					}else{
						util.drawSprite(info,sprite);
					}
			}
			if(sprite.playerName){
				ctx.save();
				ctx.font = "12px VT323";
				if(item==player)
					ctx.fillText(sprite.playerName, sprite.x, sprite.y-5);
				else
					ctx.fillText(sprite.playerName, sprite.x, sprite.y-13);
				ctx.restore();
			}
			if(item!=player&&sprite.hp&&sprite.maxHP&&sprite.maxHP!=sprite.hp){
				ctx.save();
				ctx.fillStyle='green';
				var amount=sprite.width*sprite.hp/sprite.maxHP;
				ctx.fillRect(sprite.x,sprite.y-10,amount,5);
				
				ctx.fillStyle='grey';
				ctx.fillRect(sprite.x+amount,sprite.y-10,sprite.width-amount,5);
				ctx.restore();
			}
		}
		ctx.restore();
		if(player){
			//Draw hp
			for(var x=0;x<(player.sprite.maxHP/2);x++){
				//If still have 2 more hearts to draw
				if((x+1)*2 <=player.sprite.hp)
				util.drawSprite(loadSprite(530),{x:10+32*x,y:10,width:32,height:32});
				//If 2 is too much
				else if(player.sprite.hp%2&&player.sprite.hp-(x)*2>0)
					util.drawSprite(loadSprite(531),{x:10+32*x,y:10,width:32,height:32});
				else
					util.drawSprite(loadSprite(532),{x:10+32*x,y:10,width:32,height:32});
			}
			//Draw potion
			for(var x=0;x<(player.sprite.potion);x++){
					util.drawSprite(loadSprite("HealthPotion"),{x:150+30*x,y:16,width:16,height:22});
			}
			
			//Display team
			ctx.save();
			ctx.restore();
		}
		window.requestAnimationFrame(update);
		
	}
	

	//	Create a socket to connect to the server
	var socket=new WebSocket("ws://"+window.location.host);
	var pname;
	function randomName() {
		//var randomNum = Math.floor(Math.random() * 10);
		var noun = ["CrackedHead", "Monke", "Ape", "Egg", "Groot", "Dumper", "Minion", "Nose", "Cheeks", "Leg"];
		var adjective = ["Fart","Creepy","Blushing","Adorable","Ill","Itchy","Motionless","Ugly","Tender","Nervous"];
        	return adjective[Math.floor(Math.random() * adjective.length)] + " " + noun[Math.floor(Math.random() * noun.length)];
    }
	function startGame(){
		pname=document.querySelector('#name').value;
		socket.send(JSON.stringify({"name":pname}));
		document.querySelector("#signinBackground").style.display="none";
		setUpControl();
	}
	socket.addEventListener("open",()=>{
		document.querySelector('#name').value=randomName();
	});
	socket.onmessage=recievePackets;
	//	When you get message from server do this
	function recievePackets(event){
		var message=JSON.parse(event.data);
		if(message.shop){
			createItem(1,message.shopItemX);
			createItem(2,message.shopItemY);
		}
		else if(message.item){
			message.item.forEach((item)=>{
				//Create the item and add to map or update the item
				gameMap.addOrUpdate(item);
				updateIndex();
			});
		}
		// Something got killed
		else if(message.kill){
			gameMap.remove(message.kill);
		}
		if (message.removeUpdate){
			message.removeUpdate.forEach((entity)=>{
				if(gameMap.map[entity])
					gameMap.remove(entity);
			})
		}
		if(message.restart){
			if(confirm("You died! Want to restart?")){
				//socket.send(JSON.stringify({restart:true}));
				var tempSocket=new WebSocket("ws://"+window.location.host);
				tempSocket.addEventListener("open",()=>{
					socket.send(JSON.stringify({"name":pname}));
				});
				tempSocket.onmessage=recievePackets;
				socket= tempSocket;
				gameMap= new map;
			}else{
				console.log("no restart")
			}
		}
	}

	//////////////////////////////
	//User input
	//////////////////////////////

	function setUpControl(){
		document.onkeydown = keyPress;
		document.onkeyup = keyUp;
		document.onmousemove= moveMouse;
		document.onclick=()=>{
				socket.send(JSON.stringify([1]));
		};
	}
	
	var kpress={x:0,y:0};
	var prevMouse={x:0,y:0};
	function moveMouse(e){
		var currentMouse={x:e.clientX-window.innerWidth/2,y:e.clientY-window.innerHeight/2};
		if(Math.floor(prevMouse.x)!=Math.floor(currentMouse.x)||Math.floor(prevMouse.y)!=Math.floor(currentMouse.y)){
			prevMouse=currentMouse;
		}
		try{
			socket.send(JSON.stringify([2,prevMouse.x,prevMouse.y]));
		}catch(e){
			console.log(e);
		}
	}
	//	When the user presses down
	function keyPress(e) {
		e = e || window.event;
		if(e.keyCode == '32'){
			socket.send(JSON.stringify([1]));
			return;
		}
		//up
			if (e.keyCode == '38'||e.keyCode == '87') {
				kpress.y=-1;
			}
			//down
			else if (e.keyCode == '40'||e.keyCode == '83') {
				kpress.y=1;
			}
		//left
			else if (e.keyCode == '37'||e.keyCode == '65') {
				kpress.x=-1;
			}
			//right
			else if (e.keyCode == '39'||e.keyCode == '68') {
				kpress.x=1;
			}
			socket.send(JSON.stringify([0,kpress.x,kpress.y]));
	}

	//	When the user lift the key up
	function keyUp(e) {
		e = e || window.event;
		//up
		if (e.keyCode == '38'||e.keyCode == '87') {
			kpress.y=0;
		}
		//down
		else if (e.keyCode == '40'||e.keyCode == '83') {
			kpress.y=0;
		}
		//left
		else if (e.keyCode == '37'||e.keyCode == '65') {
			kpress.x=0;
		}
		//right
		else if (e.keyCode == '39'||e.keyCode == '68') {
			kpress.x=0;
		}
		socket.send(JSON.stringify([0,kpress.x,kpress.y]));
	}

  //Sort the z index
	function updateIndex() {
		gameMap.update.sort(function(a,b) {
			a.zOrder = a.zOrder || 0;
			b.zOrder = b.zOrder || 0;
			return a.zOrder - b.zOrder
		});
	};

	
	</script>
</html>
