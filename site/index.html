<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Multiplayer Dungeon Game</title>
		<meta property="og:image" content="image/screen.jpg">
		<script src="sprite.json"></script>
		<link href="https://fonts.googleapis.com/css?family=VT323&display=swap" rel="stylesheet">
		<script
  src="https://code.jquery.com/jquery-3.4.1.slim.min.js"
  integrity="sha256-pasqAKBDmFT4eHoN2ndd6lN370kFiGUFyTiUHWhU7k8="
  crossorigin="anonymous"></script>
	</head>
	<style>
		body {
		    margin: 0;
		    font-family: sans-serif;
		    background: #6e6262;
		}
		canvas{
			display:block;
		}
		menu{
			position:fixed;
			top:0;
			width:100%;
		}
		menu #shop{
			image-rendering: pixelated;
			image-rendering: -moz-crisp-edges;
			image-rendering: crisp-edges;
			float:right;
			margin-top:15px;
			margin-right:10%;
			background-image:url(images/chest.png);
			width:100px;
			height:88px;
			background-size:contain;
		}
		menu #shop:hover{
			background-image:url(images/lightchest.png);
		}
		img{
			image-rendering: pixelated;
			image-rendering: -moz-crisp-edges;
			image-rendering: crisp-edges;
		}
		#popmenu{
			visibility:hidden;
			position:fixed;
			top:10%;
			left:15%;
			width:70%;
			height:70%;
			margin:auto;
			background:rgba(223, 223, 234, 0.95);
			padding:10px;
			box-sizing:border-box;
			color:grey;
			font-size:20px;
			display:flex;
		}
		#popmenu .choice,.display{
			background:#efefef;
			flex:1;
			margin:10px;
			position:relative;
			text-align:center;
		}
		#popmenu img{
			margin:25px;
		}
		#popmenu .bbutton{
			background: #539eff;
			width: 100%;
			box-sizing: border-box;
			text-align: center;
			color: white;
			padding: 15px;
			cursor:pointer;
		}
		#popmenu .bbutton:hover{
			color:grey;
		}
		#popmenu .wrapper{
			position:absolute;
			bottom:0;
			width:100%;
		}
		#popmenu .detail{
			padding:10px;
			color: white;
			background:black;
			padding: 15px;
		}
		#xp{
			position:fixed;
			bottom:30px;
			left:10%;
			width:80%;
			background:white;
			height:20px;
			visibility:hidden;
		}
		#xp #bar{
			width:80%;
			background:#ff0000b0;
			height:20px;
		}
		#signinBackground{
			width:100vw;
			height:100vh;
			background: url('/images/screen.jpg');
			background-size: cover;
			position:fixed;
			top:0;
		}
		#signin{
			background:#facb3e;
			width:500px;
			position: fixed;
			top: 50%; right: 50%;
			padding:20px;
			transform: translate(50%,-50%);
		}
		#signin input{
			display:block;
			padding: 10px;
			outline: 0;
			border: 0;
			margin:20px 0;
			width: 100%;
			box-sizing: border-box;
		}
	</style>
	<body>
		<canvas id="canvas"></canvas>
		<div id="signinBackground">
			<div id="signin">
				<b>Pick a Name</b>
				<input type="text" id="name"></input>
				<input type="button" value="Play" onclick="startGame()"/></input>
			</div>
		</div>
		<menu>
		<div id="shop"></div>
		<div id="popmenu">
			<div id="section1" class="choice">
			<img src="" width="100px">
			<div class="wrapper">
				<div class="detail"><br><small></small></div>
				<div class="bbutton"></div>
			</div>
			</div>
			<div id="refreshShop" class="display">
			<div class="detail">Your Gold<br><small id="gold">G</small></div>
			<div class="bbutton">1G Refresh Shop</div>
			</div>
			<div id="section2" class="choice">
				<img src="" width="100px">
				<div class="wrapper">
					<div class="detail"><br><small></small></div>
					<div class="bbutton"></div>
				</div>
			</div>
		</div>
		</menu>
		<div id="xp">
			<div id="bar"></div>
		</div>
	</body>
	<script src="client_script.js"></script>
</html>
